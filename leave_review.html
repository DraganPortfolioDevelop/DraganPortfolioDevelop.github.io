<!DOCTYPE html>
<html lang="en">
<head>

  <title>Salon La Folie</title>
  <meta name="description" content="Salon La Folie nudi najmodernije frizerske usluge za dame. Nalazimo se u Beogradu, u blizini Bulevara, Marka Oreškovića 9.">
  <meta name="keywords" content="ženski frizer, la folie, Beograd, Srbija, kozmetički salon, feniranje, farbanje, šišanje, moderno, serbia, bulevar, Salon, hairdresser, hair">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Merienda:wght@300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="/style-review.css">
  <link rel="icon" href="/image/favicon.png" type="image/png" sizes="any">
  <link rel="preconnect" href="https://salon-lafolie.com/">
  <link rel="dns-prefetch" href="https://salon-lafolie.com/" />
  <meta name="p:domain_verify" content="beb683bd6d9d0fb24cdf5c6f85f3b37a"/>

</head>
<body>
    <section id="review-form">
      <img src="./image/vk-review.png" alt="logo">
      <h2>Ostavite svoj utisak</h2>
        
      <form id="sendReview" method="POST" action="https://script.google.com/macros/s/AKfycbygkJtJwE5wOsV5tk_Gg8x66qVrxUN5LvRd3Rc0IcJC2yq6ZjKjA1GMCKvnNiFDO_AXCw/exec">
        <label>Ime (opciono)</label>
        <input type="text" name="name" id="name" required>
        <label>Email (za nagradnu igru)</label>
        <input type="email" name="email" id="email" required>
        <label>Ocena</label>
        <select name="rating" id="rating" required>
          <option value="5">⭐⭐⭐⭐⭐</option>
          <option value="4">⭐⭐⭐⭐</option>
          <option value="3">⭐⭐⭐</option>
          <option value="2">⭐⭐</option>
          <option value="1">⭐</option>
        </select>
        <label>Komentar</label>
        <textarea name="comment" id="comment" required></textarea>
        <button type="submit">Pošalji</button>
      </form>
    </section>

  <!-- OVO DODAJ -->
  <script>
  document.getElementById("sendReview").addEventListener("submit", function(e) {
      // Sakrij samo formu
      document.getElementById("sendReview").style.display = "none";
  
      // Prikaži animaciju zahvalnice
      const msg = document.createElement("div");
      msg.id = "thankYouMessage";
      msg.innerHTML = `
          <h2>Hvala vam!</h2>
          <p>Vaša recenzija je uspešno poslata.</p>
      `;
      document.body.appendChild(msg);
      msg.style.display = "block";
  
      // Sačekaj da se POST završi, zatim zatvori ili preusmeri
      setTimeout(() => {
          window.close();
          window.location.href = "https://salon-lafolie.com";
      }, 1500);
  });
  </script>

</body>


</html>
